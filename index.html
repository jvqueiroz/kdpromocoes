<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KD Promoções Fitness</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --red: #c61f27;
        --red-dark: #af1820;
        --white: #ffffff;
        --green: #4d965b;
        --text-soft: rgba(255, 255, 255, 0.9);
        --card: rgba(255, 255, 255, 0.1);
        --border: rgba(255, 255, 255, 0.14);
        --phone: #1d1d1d;
        --screen: #101820;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
        color: var(--white);
        min-height: 100vh;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0px 16px;
      }

      .container {
        width: 100%;
        max-width: 1120px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 32px;
        align-items: center;
      }

      .content {
        position: relative;
        text-align: center;
        padding: 16px 4px;
      }

      .content::before,
      .content::after {
        content: "";
        position: absolute;
        z-index: 0;
        opacity: 0.12;
      }

      .content::before {
        top: 0;
        left: 0;
        width: 160px;
        height: 160px;
      }

      .content::after {
        right: 0;
        bottom: 0;
        width: 180px;
        height: 180px;
        background: linear-gradient(315deg, #000000 0%, transparent 70%);
      }

      .content-inner {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 0 auto;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 24px;
      }

      .avatar {
        width: 175px;
        height: 175px;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .brand-name {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.34em;
      }

      h1 {
        font-size: 38px;
        line-height: 1.1;
        font-weight: 800;
        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 18px;
        line-height: 1.5;
        color: var(--text-soft);
        max-width: 520px;
        margin: 0 auto;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        padding: 0 28px;
        margin-top: 30px;
        border-radius: 999px;
        background: var(--white);
        color: var(--green);
        text-decoration: none;
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.24);
      }

      .badges {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .badge {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 12px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        backdrop-filter: blur(6px);
      }

      .phone-wrap {
        display: flex;
        justify-content: center;
      }

      .phone-shadow {
        width: 100%;
        max-width: 360px;
        
      }

      .phone {
        padding: 0px;
        position: relative;
      }

      .screen {
        border-radius: 0px;
        overflow: hidden;
      }

      .screen img {
        width: 100%;
        display: block;
        object-fit: cover;
      }

      @media (min-width: 768px) {
        .page {
          padding: 32px;
        }

        .container {
          gap: 48px;
        }

        .avatar {
          width: 128px;
          height: 128px;
        }

        h1 {
          font-size: 52px;
        }

        .subtitle {
          font-size: 20px;
        }

        .badges {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (min-width: 1024px) {
        .container {
          grid-template-columns: 1.08fr 0.92fr;
          gap: 56px;
        }

        .content {
          text-align: left;
          padding: 24px 0;
        }

        .content-inner {
          margin: 0;
        }

        .brand {
          align-items: flex-start;
        }

        .subtitle {
          margin: 0;
        }

        .phone-wrap {
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="container">
        <div class="content">
          <div class="content-inner">
            <div class="brand">
              <div class="avatar">
                <img src="./imagem-grupo.png" alt="KD Promoções" />
              </div>
            </div>

            <h1>As melhores promoções fitness direto no seu WhatsApp</h1>

            <p class="subtitle">
              Moda, whey, creatina, pré-treino e muito mais. Entre no grupo e receba
              ofertas atualizadas de forma rápida e prática.
            </p>

            <a
              class="cta"
              href="https://wa.me/5500000000000?text=Quero%20entrar%20no%20grupo%20de%20promo%C3%A7%C3%B5es"
              target="_blank"
              rel="noopener noreferrer"
            >
              Entrar no grupo agora
            </a>
          </div>
        </div>

        <div class="phone-wrap">
          <div class="phone-shadow">
            <div class="phone">
              <div class="screen">
                <img src="./preview-whatsapp.png" alt="Preview do grupo no WhatsApp" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
